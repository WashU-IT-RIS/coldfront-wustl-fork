{% extends "common/base.html" %}
{% load static %}

{% block title %}
Bulk Suballocation Update
{% endblock %}

{% block content %}
{{ bulk_attribute_config|json_script:"bulk-attribute-config" }}
<div jquery-include="/static/UserAccessManagement/index.html"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
  $(function () {
    const includes = $('[jquery-include]');
    $.each(includes, function () {
      const path = $(this).attr('jquery-include');
      $(this).load(path);
    });
  });
</script>
{% endblock content %}
